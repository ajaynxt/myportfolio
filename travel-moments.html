<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel moments — Mobile app concept</title><link rel="canonical" href="https://ajaynxt.com/travel-moments.html"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;height:100dvh;display:grid;place-items:center;background:white;overflow:hidden;color:white}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible{outline:2px solid white;outline-offset:2px}.phone{width:375px;height:780px;position:relative;overflow:hidden;border-radius:52px;background:#0a0a0c;box-shadow:inset 0 0 0 2px #ffffff14,0 0 0 1px #0009,0 0 0 10px #1a1a1e,0 0 0 11px #ffffff0f,0 0 60px #0008;zoom:var(--fit,1)}.island{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;border-radius:0 0 16px 16px;background:black;z-index:50}header{position:absolute;inset:0 0 auto;z-index:30;background:#0a0a0cbf;backdrop-filter:blur(12px);padding:56px 24px 16px;display:flex;justify-content:space-between;align-items:center}header button{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:600;padding:0}header svg{opacity:.7}.scroll{height:100%;padding:112px 24px 96px;overflow:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.card{position:relative;height:200px;border-radius:16px;overflow:hidden;margin-bottom:16px;opacity:0;transform:translateY(24px);transition:opacity .7s ease-out,transform .7s ease-out;background:#333}.card.show{opacity:1;transform:none}.card img{position:absolute;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent,#0003)}.glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px #ffffff1a;overflow:hidden}.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,#ffffff73 0%,#ffffff26 20%,transparent 40%,transparent 60%,#ffffff26 80%,#ffffff73 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.count{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:999px;font-size:12px;color:#ffffffe6}.more{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}.name{position:absolute;bottom:0;left:0;right:0;height:80px;overflow:hidden;text-align:center;color:#ffffff8c;font-size:96px;line-height:1;font-weight:800;letter-spacing:-.055em;padding-top:2px}.bottom{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:24px;padding:8px 24px;border-radius:999px}.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#ffffff80;font-size:10px;font-weight:500;padding:0}.bottom button.active{color:white}.sheet{position:absolute;bottom:0;left:0;right:0;z-index:55;background:#212125;border-radius:26px 26px 0 0;padding:24px 22px 40px;box-shadow:0 -12px 40px #0008}.sheet .close{position:absolute;top:20px;right:20px}.sheet button:not(.close),.empty button{border:1px solid #ffffff40;border-radius:12px;padding:9px 12px;margin:6px}.empty{padding-top:45px;text-align:center}@media(prefers-reduced-motion:reduce){.card{transition:none;opacity:1;transform:none}}
</style><script>function fit(){document.documentElement.style.setProperty("--fit",Math.min(1,(innerWidth-32)/375,(innerHeight-32)/780))}addEventListener("resize",fit);fit()</script><script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client?external=react","lucide-react":"https://esm.sh/lucide-react@0.344.0?external=react"}}</script><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js" defer></script></head><body><div id="root"></div><script type="text/babel" data-type="module" data-presets="react">import React,{useState,useEffect} from "react";import{createRoot}from"react-dom/client";import{ChevronDown,Calendar,MoreHorizontal,Home,User,FileText,X}from"lucide-react";const places=[{"name":"Tokyo","count":23,"image":"https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101902_e8f0f37b-18b7-4c14-bb5c-99f0724d2646.png&w=1280&q=85"},{"name":"Seoul","count":18,"image":"https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101935_4b17f250-8ddb-4ff2-b63d-dfd3497d4428.png&w=1280&q=85"},{"name":"Bali","count":29,"image":"https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101958_7116d6bf-fd6f-496f-b3cf-007688cd5123.png&w=1280&q=85"},{"name":"Rome","count":15,"image":"https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_143008_72ee7299-04a8-474c-ae73-220d45b24a20.png&w=1280&q=85"}];
function App(){const[shown,setShown]=useState(false),[tab,setTab]=useState("Trips"),[region,setRegion]=useState("Asia"),[panel,setPanel]=useState("");useEffect(()=>{const id=setTimeout(()=>setShown(true),20);return()=>clearTimeout(id)},[]);return <main className="phone"><div className="island"/><header><button onClick={()=>setPanel("Regions")}>{region}<ChevronDown size={18}/></button><button onClick={()=>setPanel("Calendar")} aria-label="Calendar"><Calendar size={22}/></button></header><section className="scroll">{tab==="Trips"?places.map((p,i)=><article className={"card "+(shown?"show":"")} key={p.name} style={{transitionDelay:(150+i*120)+"ms"}}><img src={p.image} alt={p.name}/><div className="shade"/><div className="glass count">{p.count} moments</div><button className="glass more" onClick={()=>setPanel(p.name)} aria-label={"More "+p.name}><MoreHorizontal size={16}/></button><div className="name">{p.name}</div></article>):<div className="empty"><h2>{tab}</h2><p>Explore the trip collection.</p><button onClick={()=>setTab("Trips")}>View trips</button></div>}</section><nav className="glass bottom">{[["Feed",Home],["Account",User],["Trips",FileText]].map(([name,Icon])=><button key={name} className={tab===name?"active":""} onClick={()=>setTab(name)} aria-current={tab===name?"page":undefined}><Icon size={20}/>{name}</button>)}</nav>{panel&&<div className="sheet"><button className="close" onClick={()=>setPanel("")} aria-label="Close"><X size={20}/></button><h2>{panel}</h2>{panel==="Regions"?<div>{["Asia","Europe","All trips"].map(r=><button key={r} onClick={()=>{setRegion(r);setPanel("")}}>{r}</button>)}</div>:<p>{panel==="Calendar"?"Trip calendar concept":(places.find(p=>p.name===panel)?.count||0)+" moments saved in this concept."}</p>}</div>}</main>}
createRoot(document.getElementById("root")).render(<App/>);</script></body></html>
