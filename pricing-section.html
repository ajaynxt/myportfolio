<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Section — UI concept</title><link rel="canonical" href="https://ajaynxt.com/pricing-section.html"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"><style>
:root{--background:0 0% 0%;--foreground:0 0% 96%;--landing-surface:rgba(255,255,255,.1);--landing-surface-hover:rgba(255,255,255,.16);--landing-border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font:400 14px/1.5 Inter,sans-serif}#pricing{padding:64px 0;width:100%}.container{max-width:1080px;margin:auto;padding:0 24px}header{margin-bottom:56px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}header h2{font-size:36px;font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0}header p{max-width:384px;color:hsl(var(--foreground)/.6);font-size:16px;margin:0}.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--landing-surface);border:1px solid var(--landing-border);padding:4px 12px;font-size:12px;color:hsl(var(--foreground)/.8);margin-bottom:24px;backdrop-filter:blur(8px)}.pill i{width:6px;height:6px;border-radius:50%;background:hsl(var(--foreground)/.7)}.grid{max-width:768px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.spot{position:relative;border-radius:16px;border:1px solid var(--landing-border);--spot-x:-9999px;--spot-y:-9999px;isolation:isolate}.ring{position:absolute;inset:-1px;padding:1px;border-radius:inherit;background:radial-gradient(circle var(--size) at var(--spot-x) var(--spot-y),rgba(255,255,255,var(--intensity)),transparent 60%);-webkit-mask:linear-gradient(hsl(var(--background)) 0 0) content-box,linear-gradient(hsl(var(--background)) 0 0);mask:linear-gradient(hsl(var(--background)) 0 0) content-box,linear-gradient(hsl(var(--background)) 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.ring.inner{inset:11px;opacity:.55}.outer{padding:12px;height:100%}.inner-card{position:relative;display:flex;flex-direction:column;height:100%;border:1px solid var(--landing-border);border-radius:16px;padding:32px}.best{position:absolute;top:-12px;left:50%;transform:translateX(-50%);border:1px solid var(--landing-border);background:hsl(var(--foreground));color:hsl(var(--background));border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;white-space:nowrap}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:hsl(var(--foreground)/.6)}.divider{border-top:1px solid var(--landing-border);margin-top:12px}.price{display:flex;align-items:baseline;gap:8px;margin-top:40px}.price span{font-size:44px;line-height:1;letter-spacing:-.025em}.price s{font-size:18px;color:hsl(var(--foreground)/.4)}.description{color:hsl(var(--foreground)/.6);margin:16px 0 0}.button-row{margin-top:28px}.btn{height:32px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;font-size:14px;line-height:1;transition:background .2s}.primary{color:hsl(var(--background));background:hsl(var(--foreground)/.8)}.primary:hover{background:hsl(var(--foreground))}.secondary{background:var(--landing-surface);border:1px solid var(--landing-border);color:hsl(var(--foreground));backdrop-filter:blur(2.5px);font-weight:500}.secondary:hover{background:var(--landing-surface-hover)}.animated-text{position:relative;overflow:hidden;display:block;height:1em}.animated-text span{display:block;transition:transform .25s}.btn:hover .animated-text span{transform:translateY(-100%)}ul{margin:28px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}li{display:flex;align-items:center;gap:12px;padding:16px 0;font-size:14px}li.line{border-top:1px solid var(--landing-border)}li.included{color:hsl(var(--foreground)/.85)}li.excluded{color:hsl(var(--foreground)/.4)}.feature-icon{display:grid;place-items:center;border-radius:50%;width:20px;height:20px;flex:none;border:1px solid var(--landing-border)}.included .feature-icon{border-color:hsl(var(--foreground)/.2);background:hsl(var(--foreground)/.06)}.material-symbols-outlined{font-family:"Material Symbols Outlined";line-height:1;font-weight:40 function FadeUp({children,delay=0,className}){const reduced=useReducedMotion();return <motion.div className={className} initial={reduced?false:{opacity:0,y:24}} whileInView={{opacity:1,y:0}} viewport={{once:true,amount:.3}} transition={{duration:reduced?0:.6,delay:reduced?0:delay,ease:[.22,1,.36,1]}}>{children}</motion.div>}
function SpotlightBorder({children,className,radius="2xl",size=520,intensity=.5}){return <div className={cn("spot","rounded-"+radius,className)} style={{"--size":size+"px","--intensity":intensity}} onPointerMove={e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty("--spot-x",e.clientX-r.left+"px");e.currentTarget.style.setProperty("--spot-y",e.clientY-r.top+"px")}} onPointerLeave={e=>{e.currentTarget.style.setProperty("--spot-x","-9999px");e.currentTarget.style.setProperty("--spot-y","-9999px")}}><span className="ring"/><span className="ring inner"/>{children}</div>}
function AnimatedText({children}){return <span className="animated-text"><span>{children}</span><span aria-hidden="true">{children}</span></span>}
function Button({children,primary,href}){return <a href={href} className={cn("btn",primary?"primary":"secondary")} onClick={e=>{e.preventDefault();document.querySelector("dialog").showModal()}}><AnimatedText>{children}</AnimatedText></a>}
function PrimaryButton(props){return <Button {...props} primary/>}function SecondaryButton(props){return <Button {...props}/>}
function PricingCard({plan}){return <SpotlightBorder radius="2xl" size={460} intensity={.5} className="outer"><div className="inner-card" style={{backgroundColor:plan.bg}}>{plan.badge&&<div className="best">{plan.badge}</div>}<FadeUp><div className="eyebrow">{plan.name}</div></FadeUp><div className="divider"/><FadeUp delay={.1}><div className="price"><span>${plan.price}</span><s>${plan.originalPrice}</s></div></FadeUp><FadeUp delay={.2}><p className="description">{plan.description}</p></FadeUp><FadeUp delay={.3}><div className="button-row">{plan.featured?<PrimaryButton href="/auth?mode=signup" size="sm">Get Started</PrimaryButton>:<SecondaryButton href="/auth?mode=signup" size="sm">Get Started</SecondaryButton>}</div></FadeUp><FadeUp delay={.4}><ul>{plan.features.map((f,i)=><li key={f.text} className={cn(f.included?"included":"excluded",i!==0&&"line")}><span className="feature-icon"><MIcon name={f.included?"check":"close"} size={12}/></span>{f.text}</li>)}</ul></FadeUp></div></SpotlightBorder>}
function PricingSection(){return <section id="pricing"><div className="container"><header><div><FadeUp><span className="pill"><i/>Pricing</span></FadeUp><FadeUp delay={.1}><h2>Clear pricing plans<br className="desktop-break"/> that scale with you.</h2></FadeUp></div><FadeUp delay={.2}><p>One-time payment. Lifetime access. Pick the plan that fits how far you want to go.</p></FadeUp></header><div className="grid">{plans.map(p=><PricingCard key={p.name} plan={p}/>)}</div></div></section>}
