  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lights - Warm Champagne Gold, Ruby Wine & Amber
    const ambient = new THREE.AmbientLight(0xfff5ea, 1.2);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xd4a84b, 3.5);
    keyLight.position.set(5, 7, 8);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9f2638, 2.4);
    fillLight.position.set(-6, -4, 6);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xc8794a, 2.2);
    rimLight.position.set(0, -6, -4);
    scene.add(rimLight);

    const pointLight = new THREE.PointLight(0xe8c77b, 4, 25);
    pointLight.position.set(0, 0, 4);
    scene.add(pointLight);

    // Main 3D Object - Polished Champagne Gold Torus Knot
    const geo = new THREE.TorusKnotGeometry(1.8, 0.55, 220, 32);
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xd4a84b,
      metalness: 0.85,
      roughness: 0.16,
      clearcoat: 1.0,
      clearcoatRoughness: 0.2,
      emissive: 0x5a3415,
      emissiveIntensity: 0.35,
      envMapIntensity: 1.2,
    });
    const knot = new THREE.Mesh(geo, mat);
    scene.add(knot);

    // Wireframe ring - Luxury Wine accent
    const wireGeo = new THREE.TorusKnotGeometry(1.85, 0.58, 64, 16);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x9f2638,
      wireframe: true,
      transparent: true,
      opacity: 0.22,
    });
    const wire = new THREE.Mesh(wireGeo, wireMat);
    scene.add(wire);

    // Outer glow ring - Warm champagne
    const glowGeo = new THREE.RingGeometry(2.3, 2.8, 64);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xd4a84b,
      transparent: true,
      opacity: 0.14,
      side: THREE.DoubleSide,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.z = -1;
    scene.add(glow);

    // Secondary small knot - Royal Wine
    const smallGeo = new THREE.TorusKnotGeometry(0.6, 0.2, 80, 12);
    const smallMat = new THREE.MeshPhysicalMaterial({
      color: 0x9f2638,
      metalness: 0.8,
      roughness: 0.2,
      emissive: 0x5a121f,
      emissiveIntensity: 0.4,
    });
    const smallKnot = new THREE.Mesh(smallGeo, smallMat);
    smallKnot.position.set(3.2, 1.5, 1);
    scene.add(smallKnot);

    // Particles - Warm Champagne Gold & Amber Stardust
    const particleCount = 700;
    const positions = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);
    const colors = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const r = 5 + Math.random() * 20;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      sizes[i] = 0.02 + Math.random() * 0.07;
      const c = new THREE.Color().setHSL(0.08 + Math.random() * 0.06, 0.85, 0.45 + Math.random() * 0.35);
      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 0.065,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.NormalBlending,
      sizeAttenuation: true,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Mouse tracking
    let mouseX = 0, mouseY = 0;
    let targetRotX = 0, targetRotY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    }, { passive: true });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      targetRotX += (mouseY - targetRotX) * 0.04;
      targetRotY += (mouseX - targetRotY) * 0.04;

      knot.rotation.x = t * 0.15 + targetRotX * 0.6;
      knot.rotation.y = t * 0.25 + targetRotY * 0.8;
      wire.rotation.copy(knot.rotation);
      glow.rotation.x = knot.rotation.x;
      glow.rotation.y = knot.rotation.y;
      glow.rotation.z = t * 0.1;

      smallKnot.rotation.x = t * 0.4;
      smallKnot.rotation.y = t * 0.5;
      smallKnot.position.y = 1.5 + Math.sin(t * 0.8) * 0.4;
      smallKnot.position.x = 3.2 + Math.cos(t * 0.6) * 0.3;

      pointLight.position.x = Math.sin(t * 0.5) * 3;
      pointLight.position.y = Math.cos(t * 0.7) * 2;
      pointLight.intensity = 3 + Math.sin(t * 1.2) * 1.2;

      particles.rotation.y = t * 0.015;
      particles.rotation.x = Math.sin(t * 0.05) * 0.05;

      camera.position.x = Math.sin(t * 0.08) * 0.8 + targetRotY * 0.3;
      camera.position.y = Math.cos(t * 0.1) * 0.5 + targetRotX * 0.2;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
  <script src="brand-navigation.js" defer></script>
  <script src="analytics.js" defer></script>
</body>
</html>
