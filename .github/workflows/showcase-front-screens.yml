name: Generate showcase front screens
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showcase-front-screens.yml'
      - 'showcase.html'
      - 'hiven.html'
      - 'freight-hero.html'
      - 'sun-timeline.html'
      - 'bank-cards.html'
      - 'scripts/capture-showcase-covers.cjs'
permissions:
  contents: write
concurrency:
  group: showcase-front-screens
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright sharp
      - run: npx playwright install --with-deps chromium
      - name: Select best fully loaded UI covers
        run: node scripts/capture-showcase-covers.cjs
      - name: Commit generated screens
        if: always()
        run: |
          if [ ! -f assets/showcase-first-frames/manifest.json ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase-first-frames
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate actual UI showcase first-frame images"
          git pull --rebase origin main
          git push origin HEAD:main
