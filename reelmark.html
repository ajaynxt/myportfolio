<script>
'use strict';const videoURL='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/04fd3d5f-99d7-476e-98a4-46c08518ffb3.mp4';const labels=['Sneaker','Skincare splash','Latte pour','Headphones','Plant shop','Florist bouquet','Pottery wheel','Serum splash','Latte top-down','Headphones on a stand'];const row=document.querySelector('.carousel'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,phone=matchMedia('(max-width:820px)');const preview=new URLSearchParams(location.search).has('showcase_preview');const cards=labels.map((label,i)=>{const el=document.createElement('div');el.className='card';el.setAttribute('aria-label',label);const poster=document.createElement('div');poster.className='sprite still';el.append(poster);let v=null;if(!reduce){v=document.createElement('video');v.className='sprite clip';v.src=videoURL;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='auto';v.setAttribute('aria-hidden','true');v.addEventListener('loadeddata',()=>v.classList.add('ready'),{once:true});v.play().catch(()=>{});el.append(v)}const icon=document.createElement('span');icon.className='play';icon.innerHTML='<svg viewBox="0 0 16 16"><path d="M4 2 14 8 4 14Z"/></svg>';el.append(icon);row.append(el);return {el,poster,v,i}});
